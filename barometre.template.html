<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__DETAILS_TOPIC_LABEL__ — Baromètre territorial Urssaf</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>__DETAILS_CSS__</style>
</head>
<body data-topic="__DETAILS_TOPIC__">
  <nav class="page-links" aria-label="Lectures du baromètre"><a href="index.html">Accueil</a><a href="__DETAILS_BRIEF_LINK__">Le baromètre en bref</a></nav>
  __ERROR_NOTICE__
  <div class="tooltip" id="tooltip">
    <div class="mono" id="tooltipLabel"></div>
    <strong id="tooltipValue"></strong>
  </div>
  <div class="page">
    <div class="shell">
      __DETAILS_HEADER__
      <script>
        {
          const trigger = document.getElementById("geoTrigger");
          let pending = false;
          const trackToggle = () => { pending = !pending; };
          trigger.addEventListener("click", trackToggle);
          window.BAROMETRE_TAKE_GEOGRAPHY_TOGGLE = () => {
            trigger.removeEventListener("click", trackToggle);
            return pending;
          };
        }
      </script>

      <section class="stage-shell" id="stageShell" data-phase="landing" aria-label="Indicateurs par territoire" tabindex="-1">
        <div class="stage-media">
          <img class="stage-poster" id="stagePoster" alt="" decoding="async" hidden>
          <video class="stage-video" id="stageVideo" playsinline muted loop preload="none" aria-hidden="true"></video>
          <div class="stage-location">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M7 15.8c-2.2.6-3.6 1.5-3.6 2.7 0 1.8 3.8 3.2 8.6 3.2s8.6-1.4 8.6-3.2c0-1.2-1.4-2.1-3.7-2.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M12 2.2a6.1 6.1 0 0 0-6.1 6.1c0 3.7 4.5 8.3 5.8 9.6a.44.44 0 0 0 .6 0c1.3-1.3 5.8-5.9 5.8-9.6A6.1 6.1 0 0 0 12 2.2Z" fill="currentColor"/>
              <circle cx="12" cy="8.3" r="2.3" fill="#fff"/>
            </svg>
            <span id="stageLocationName"></span>
          </div>
          <div class="map-stage landing-only" id="mapStage">
            <div class="landing-map-stack">
              <svg id="landingMap" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMin meet" role="group" aria-label="Carte des régions françaises" aria-describedby="mapDesc">
                <desc id="mapDesc">Choisissez une région pour consulter ses indicateurs.</desc>
              </svg>
            </div>
          </div>
        </div>

        <div id="cockpitMainlandFrame" class="landing-only" aria-hidden="true"></div>
        <section id="cockpitReadout" class="landing-only" aria-labelledby="cockpitScopeName" aria-live="polite" aria-atomic="true">
          <h2 id="cockpitScopeName">France entière</h2>
          <div class="hero-kpis" id="cockpitKpis"></div>
        </section>
        <div id="cockpitTerritories" class="landing-only cockpit-territories" role="group" aria-label="France entière et régions d’outre-mer"></div>

        <div class="stage-copy">
          <div class="hero-panel glass" id="heroPanel">
            <h2 id="heroTitle">France entière</h2>
            <div class="hero-kpis" id="heroKpis"></div>
          </div>
        </div>
        <button class="stage-video-toggle" id="stageVideoToggle" type="button" aria-label="Lire la vidéo" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path class="stage-video-play" d="M8 5.5 19 12 8 18.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <g class="stage-video-pause">
              <rect x="6" y="5" width="4" height="14" rx="1.2"/>
              <rect x="14" y="5" width="4" height="14" rx="1.2"/>
            </g>
          </svg>
        </button>
      </section>

      __MAP_DEPENDENCY__
      <script>
        window.BAROMETRE_BOOT = __BOOT_JSON__;
      </script>
      <script id="barometre-region-map">__REGION_MAP_SCRIPT__</script>

      <main class="story" id="story">
__CHAPTER_SECTIONS_HTML__
      </main>

    </div>
  </div>

  __EXTERNAL_SCRIPTS__
  __DEPENDENCY_GUARD__
  <script>
    window.BAROMETRE_DEFERRED_GZIP = "__DEFERRED_B64__";
  </script>
  <script>__DETAILS_SCRIPT__</script>
</body>
</html>
