<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baromètre territorial Urssaf</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>__DETAILS_CSS__</style>
</head>
<body>
  <nav class="page-links" aria-label="Lectures du baromètre"><a href="index.html">Accueil</a><a href="barometre_bref.html">Le baromètre en bref</a></nav>
  __ERROR_NOTICE__
  <div class="page">
    <div class="shell">
      <header class="topbar econ-header" id="econHeader">
        <div class="econ-header-art-frame" aria-hidden="true">
          <svg class="econ-header-art" viewBox="0 0 185 122" focusable="false">
            <defs>
              <clipPath id="econRightBlockClip" clipPathUnits="userSpaceOnUse">
                <rect x="123" y="60" width="62" height="62"></rect>
              </clipPath>
            </defs>
            <rect x="0" y="0" width="185" height="122" fill="var(--econ-bg)" shape-rendering="crispEdges"></rect>
            <circle cx="31" cy="31" r="31" fill="var(--econ-teal-deep)"></circle>
            <circle cx="77" cy="15" r="15" fill="#FFFFFF"></circle>
            <circle cx="107" cy="15" r="15" fill="var(--econ-sky)"></circle>
            <circle cx="77" cy="45" r="15" fill="var(--econ-sky)"></circle>
            <circle cx="107" cy="45" r="15" fill="var(--econ-yellow)"></circle>
            <circle cx="31" cy="91.5" r="31.5" fill="var(--econ-sky)"></circle>
            <circle cx="0" cy="91.5" r="31.5" fill="var(--econ-yellow)"></circle>
            <rect x="62" y="60" width="61" height="62" fill="var(--econ-coral)" shape-rendering="crispEdges"></rect>
            <circle cx="92.5" cy="90.5" r="15" fill="#FFFFFF"></circle>
            <rect x="123" y="60" width="62" height="62" fill="var(--econ-orange)" shape-rendering="crispEdges"></rect>
            <g clip-path="url(#econRightBlockClip)">
              <circle cx="184" cy="60" r="63" fill="var(--econ-blue)"></circle>
              <circle cx="184" cy="60" r="32" fill="var(--econ-bg)"></circle>
            </g>
            <rect x="123" y="60" width="29" height="1" fill="var(--econ-blue)" shape-rendering="crispEdges"></rect>
            <rect x="152" y="60" width="33" height="1" fill="var(--econ-bg)" shape-rendering="crispEdges"></rect>
          </svg>
        </div>
        <div class="econ-header-copy">
          <h1>Baromètre économique</h1>
          <p id="publicationMeta">__DETAILS_PUBLICATION__</p>
        </div>
        <div class="geo-control" id="geoControl">
          <button class="geo-trigger" id="geoTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choisir la zone géographique, actuellement France entière">
            <span class="geo-trigger-value" id="geoCurrent">France entière</span>
            <span class="geo-trigger-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
          <div class="geo-menu" id="geoMenu" role="listbox" aria-label="Sélectionner une géographie"></div>
        </div>
      </header>

      <section class="stage-shell" id="stageShell" data-phase="landing">
        <div class="stage-media">
          <video class="stage-video" id="stageVideo" playsinline muted loop preload="auto"></video>
          <div class="video-glow"></div>
          <div class="map-stage" id="mapStage">
            <div class="landing-map-stack">
              <svg id="landingMapShadow" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMin meet" aria-hidden="true" focusable="false"></svg>
              <svg id="landingMap" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="mapTitle mapDesc">
                <title id="mapTitle">Carte des régions françaises</title>
                <desc id="mapDesc">Carte interactive avec régions métropolitaines et encarts ultramarins.</desc>
              </svg>
            </div>
          </div>
        </div>

        <div class="stage-copy">
          <div class="hero-panel glass" id="heroPanel">
            <div class="hero-title-block">
              <span class="mono" id="heroEyebrow">Sélection</span>
              <h1 id="heroTitle">France entière</h1>
              <p id="heroLead">Masse salariale, emploi privé, auto-entrepreneurs et pression de recouvrement.</p>
              <div class="hero-chip-row" id="heroDates"></div>
            </div>
            <div class="hero-kpis" id="heroKpis"></div>
          </div>
        </div>
      </section>

      <div class="switch-rail" id="switchRail" hidden aria-hidden="true"></div>

      <main class="story" id="story">
        <nav class="subject-nav" id="subjectNav" aria-label="Chapitres"></nav>
__CHAPTER_SECTIONS_HTML__
      </main>

    </div>
  </div>

  <div class="tooltip" id="tooltip">
    <div class="mono" id="tooltipLabel"></div>
    <strong id="tooltipValue"></strong>
  </div>

  __EXTERNAL_SCRIPTS__
  __DEPENDENCY_GUARD__
  <script>
    window.BAROMETRE_BOOT = __BOOT_JSON__;
    window.BAROMETRE_DEFERRED_GZIP = "__DEFERRED_B64__";
  </script>
  <script>__DETAILS_SCRIPT__</script>
</body>
</html>
