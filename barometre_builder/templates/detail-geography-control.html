<div class="geo-control" id="geoControl">
  <button class="geo-trigger" id="geoTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="geoMenu" aria-label="Choisir la zone géographique, actuellement France entière">
    <span class="geo-trigger-value" id="geoCurrent">France entière</span>
    <span class="geo-trigger-chevron" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </button>
  <div class="geo-menu" id="geoMenu" role="listbox" aria-label="Sélectionner une géographie"></div>
</div>
