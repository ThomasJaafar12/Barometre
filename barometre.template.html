<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__DETAILS_TOPIC_LABEL__ — Baromètre territorial Urssaf</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>__DETAILS_CSS__</style>
</head>
<body data-topic="__DETAILS_TOPIC__">
  <nav class="page-links" aria-label="Lectures du baromètre"><a href="index.html">Accueil</a><a href="__DETAILS_BRIEF_LINK__">Le baromètre en bref</a></nav>
  __ERROR_NOTICE__
  <div class="tooltip" id="tooltip">
    <div class="mono" id="tooltipLabel"></div>
    <strong id="tooltipValue"></strong>
  </div>
  <div class="page">
    <div class="shell">
      __DETAILS_HEADER__
      <script>
        {
          const trigger = document.getElementById("geoTrigger");
          let pending = false;
          const trackToggle = () => { pending = !pending; };
          trigger.addEventListener("click", trackToggle);
          window.BAROMETRE_TAKE_GEOGRAPHY_TOGGLE = () => {
            trigger.removeEventListener("click", trackToggle);
            return pending;
          };
        }
      </script>

      <section class="stage-shell" id="stageShell" data-phase="landing">
        <div class="stage-media">
          <img class="stage-poster" id="stagePoster" alt="" decoding="async" hidden>
          <video class="stage-video" id="stageVideo" playsinline muted loop preload="none" aria-hidden="true"></video>
          <div class="video-glow"></div>
          <div class="map-stage" id="mapStage">
            <div class="landing-map-stack">
              <svg id="landingMapShadow" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMin meet" aria-hidden="true" focusable="false"></svg>
              <svg id="landingMap" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="mapTitle mapDesc">
                <title id="mapTitle">Carte des régions françaises</title>
                <desc id="mapDesc">Carte interactive avec régions métropolitaines et encarts ultramarins.</desc>
              </svg>
            </div>
          </div>
        </div>

        <div class="stage-copy">
          <div class="hero-panel glass" id="heroPanel">
            <div class="hero-title-block">
              <span class="mono" id="heroEyebrow">Sélection</span>
              <h2 id="heroTitle">France entière</h2>
              <p id="heroLead">__DETAILS_TOPIC_LABEL__.</p>
              <div class="hero-chip-row" id="heroDates"></div>
            </div>
            <div class="hero-kpis" id="heroKpis"></div>
          </div>
        </div>
        <button class="stage-video-toggle" id="stageVideoToggle" type="button" hidden>Lire la vidéo</button>
      </section>

      __MAP_DEPENDENCY__
      <script>
        window.BAROMETRE_BOOT = __BOOT_JSON__;
      </script>
      <script id="barometre-region-map">__REGION_MAP_SCRIPT__</script>

      <main class="story" id="story">
__CHAPTER_SECTIONS_HTML__
      </main>

    </div>
  </div>

  __EXTERNAL_SCRIPTS__
  __DEPENDENCY_GUARD__
  <script>
    window.BAROMETRE_DEFERRED_GZIP = "__DEFERRED_B64__";
  </script>
  <script>__DETAILS_SCRIPT__</script>
</body>
</html>
