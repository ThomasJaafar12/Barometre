<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baromètre territorial Urssaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #154389;
      --bg-soft: #006FB8;
      --page-bg: #E9DACA;
      --page-bg-soft: #C9D7EC;
      --panel: rgba(233, 218, 202, 0.16);
      --panel-strong: rgba(21, 67, 137, 0.78);
      --panel-faint: rgba(201, 215, 236, 0.16);
      --surface: rgba(233, 218, 202, 0.18);
      --surface-strong: rgba(201, 215, 236, 0.26);
      --surface-inset: rgba(255, 255, 255, 0.12);
      --nav-panel: rgba(21, 67, 137, 0.68);
      --editorial-panel: rgba(21, 67, 137, 0.84);
      --editorial-panel-inner: rgba(201, 215, 236, 0.13);
      --chip-bg: rgba(201, 215, 236, 0.16);
      --chip-border: rgba(201, 215, 236, 0.28);
      --chip-active-a: rgba(0, 111, 184, 0.70);
      --chip-active-b: rgba(53, 187, 217, 0.28);
      --line: rgba(201, 215, 236, 0.18);
      --line-strong: rgba(201, 215, 236, 0.32);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.76);
      --muted-soft: rgba(255, 255, 255, 0.56);
      --shadow: 0 40px 120px rgba(0, 0, 0, 0.35);
      --radius-xl: 36px;
      --radius-lg: 26px;
      --radius-md: 20px;
      --accent: #006FB8;
      --accent-deep: #154389;
      --accent-secondary: #35BBD9;
      --accent-glow: rgba(123, 163, 214, 0.26);
      --danger: #B32340;
      --warning: #FBBA00;
      --neutral: rgba(201, 215, 236, 0.16);
      --bg-orb-a: rgba(123, 163, 214, 0.28);
      --bg-orb-b: rgba(53, 187, 217, 0.22);
      --bg-orb-c: rgba(221, 183, 136, 0.14);
      --stage-glow-a: rgba(123, 163, 214, 0.24);
      --stage-glow-b: rgba(53, 187, 217, 0.18);
      --button-active-a: rgba(123, 163, 214, 0.28);
      --button-active-b: rgba(0, 169, 122, 0.18);
      --hero-action-a: rgba(123, 163, 214, 0.28);
      --hero-action-b: rgba(0, 169, 122, 0.16);
      --map-idle: rgba(201,215,236,0.14);
      --map-empty: rgba(201,215,236,0.10);
      --map-unavailable: rgba(137,112,85,0.22);
      --focus-stroke: rgba(255,255,255,0.88);
      --focus-glow: rgba(123,163,214,0.24);
      --scene-sea-a: rgba(34, 110, 146, 0.9);
      --scene-sea-b: rgba(7, 30, 45, 0.98);
      --scene-foam: rgba(226, 246, 255, 0.58);
      --scene-relief-shadow: rgba(5, 14, 20, 0.36);
      --scene-cloud: rgba(248, 252, 255, 0.78);
      --scene-monument-glow: rgba(255, 236, 190, 0.42);
      --shell-width: min(calc(100% - 28px), 1520px);
      --chapter-rail-top: 18px;
      --chapter-scroll-margin: 168px;
      --chapter-tone-1: linear-gradient(135deg, rgba(8, 47, 96, 0.94), rgba(0, 111, 184, 0.74));
      --chapter-tone-2: linear-gradient(135deg, rgba(26, 48, 76, 0.92), rgba(196, 103, 34, 0.62));
      --chapter-tone-3: linear-gradient(135deg, rgba(23, 51, 77, 0.92), rgba(53, 187, 217, 0.46));
      --chapter-tone-4: linear-gradient(135deg, rgba(81, 49, 27, 0.90), rgba(238, 115, 38, 0.72));
      --chapter-shadow-1: rgba(0,111,184,0.24);
      --chapter-shadow-2: rgba(238,115,38,0.20);
      --chapter-shadow-3: rgba(53,187,217,0.18);
      --chapter-shadow-4: rgba(238,115,38,0.20);
      --chapter-rail-line: rgba(255,255,255,0.18);
      --chapter-tab-min-width: 238px;
      --chapter-tab-gap: 8px;
      --chapter-tab-height: 76px;
      --chapter-tab-height-active: 88px;
      --chapter-tab-skew-right: 34px;
      --chapter-tab-skew-left: 0px;
      --chapter-tab-overlay: linear-gradient(180deg, rgba(255,255,255,0.13), rgba(255,255,255,0.04) 44%, rgba(0,0,0,0.05) 100%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Manrope", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, var(--bg-orb-a), transparent 28%),
        radial-gradient(circle at 84% 16%, var(--bg-orb-b), transparent 24%),
        radial-gradient(circle at 50% 100%, var(--bg-orb-c), transparent 30%),
        linear-gradient(180deg, var(--page-bg-soft, var(--bg-soft)) 0%, var(--page-bg, var(--bg)) 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 94%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, var(--stage-glow-a), transparent 20%),
        radial-gradient(circle at 80% 22%, var(--stage-glow-b), transparent 26%),
        radial-gradient(circle at 55% 78%, var(--bg-orb-c), transparent 20%);
      filter: blur(42px);
      opacity: 0.7;
    }

    .page {
      width: var(--shell-width);
      margin: 18px auto 46px;
      position: relative;
      z-index: 1;
    }

    .glass {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
    }
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, rgba(255,255,255,0.28), transparent 28%),
        radial-gradient(circle at top right, rgba(255,255,255,0.16), transparent 36%);
      mix-blend-mode: screen;
      opacity: 0.9;
    }
    .shell {
      border-radius: 44px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
        var(--panel-strong);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 45px 120px rgba(0, 0, 0, 0.45);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 28px;
      margin-bottom: 16px;
      background: var(--panel-faint);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      flex: 1 1 280px;
      gap: 14px;
      min-width: 0;
    }
    .brand img {
      width: 130px;
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.22));
    }
    .brand-meta {
      min-width: 0;
      display: grid;
      gap: 3px;
    }
    .mono {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted-soft);
    }
    .brand strong {
      font-size: 0.98rem;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .hero-action {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(145deg, var(--hero-action-a), var(--hero-action-b)),
        rgba(255,255,255,0.07);
      color: var(--text);
      border-radius: 999px;
      padding: 14px 18px;
      font: 700 0.92rem "Manrope", sans-serif;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 16px 36px rgba(0,0,0,0.22);
      transition: transform 220ms ease, background 220ms ease, border-color 220ms ease;
    }
    .hero-action:hover,
    .hero-action:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.24);
    }

    .stage-shell {
      position: relative;
      min-height: 86vh;
      border-radius: 38px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .stage-shell::before,
    .stage-shell::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(18px);
      pointer-events: none;
      opacity: 0;
    }
    .stage-shell::before {
      width: 340px;
      height: 340px;
      background: var(--stage-glow-a);
      top: -120px;
      left: -90px;
    }
    .stage-shell::after {
      width: 380px;
      height: 380px;
      background: var(--stage-glow-b);
      right: -80px;
      bottom: -160px;
    }
    .stage-media {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .stage-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--bg);
      opacity: 0;
      transition: opacity 520ms ease;
      filter: none;
      will-change: opacity;
    }
    .video-glow {
      position: absolute;
      inset: 0;
      background: none;
      opacity: 0;
      transition: opacity 520ms ease;
      pointer-events: none;
    }
    .stage-shell[data-phase="region"] .stage-video,
    .stage-shell[data-phase="region"] .video-glow {
      opacity: 1;
    }
    .stage-shell[data-phase="national"] .stage-video,
    .stage-shell[data-phase="national"] .video-glow {
      opacity: 1;
    }

    .map-stage {
      position: absolute;
      inset: 0;
      padding: 24px;
      transition: opacity 460ms ease;
    }
    .map-stage svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .map-stage.is-muted {
      opacity: 0.24;
    }
    .map-stage.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .stage-copy {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: flex-end;
      padding: 28px;
      min-height: 86vh;
      align-items: end;
      pointer-events: none;
    }
    .stage-copy > * { pointer-events: auto; }
    .hero-panel {
      align-self: end;
      border-radius: 32px;
      padding: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)), var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(22px);
      opacity: 1;
      transition: opacity 420ms ease, transform 420ms ease;
    }
    .hero-panel h1 {
      margin: 0;
      font-family: "Syne", sans-serif;
      font-size: clamp(3.3rem, 7vw, 6.8rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      max-width: 10ch;
    }
    .hero-panel p,
    .kpi-card p,
    .section-note,
    .ranking-item span,
    .sparkline-value,
    .empty-state p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }
    .hero-panel {
      display: grid;
      gap: 18px;
      justify-self: end;
      max-width: 460px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
    }
    .stage-shell[data-phase="region"] .hero-panel,
    .stage-shell[data-phase="national"] .hero-panel {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .hero-chip-row,
    .control-row,
    .metric-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chip-pill,
    .metric-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.09);
      background: var(--panel-faint);
      color: var(--text);
      font: 700 0.88rem "Manrope", sans-serif;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .metric-button,
    .chip-pill {
      cursor: pointer;
      appearance: none;
    }
    .metric-button.is-active,
    .chip-pill.is-active {
      border-color: rgba(255,255,255,0.18);
      background:
        linear-gradient(145deg, var(--button-active-a), var(--button-active-b)),
        rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.26), 0 14px 30px rgba(0,0,0,0.18);
    }

    .hero-title-block {
      display: grid;
      gap: 10px;
    }
    .hero-title-block h1 {
      max-width: 8ch;
      font-size: clamp(2.8rem, 6vw, 5.4rem);
    }
    .hero-chip-row {
      gap: 8px;
    }
    .hero-chip {
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--panel-faint);
      font: 500 12px "IBM Plex Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    .kpi-card {
      border-radius: 24px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05)),
        var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      min-height: 122px;
      display: grid;
      align-content: start;
      gap: 10px;
    }
    .kpi-card strong {
      font-family: "Syne", sans-serif;
      font-size: clamp(1.6rem, 3vw, 2.6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
    }
    .kpi-card strong.is-textual {
      font-size: clamp(1.55rem, 2.4vw, 2.2rem);
      line-height: 0.88;
      letter-spacing: -0.04em;
    }
    .kpi-card .label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted-soft);
    }
    .kpi-card .meta {
      font-size: 0.86rem;
      color: var(--muted);
    }
    .text-highlight {
      --highlight-bg: var(--highlight-payroll-bg);
      --highlight-ink: #FFFFFF;
      display: inline;
      padding: 0.03em 0.22em 0.05em;
      color: var(--highlight-ink);
      background: var(--highlight-bg);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      line-height: 1.08;
      font-weight: 900;
    }
    .text-highlight--payroll {
      --highlight-bg: #E62B8A;
      --highlight-ink: #FFFFFF;
    }
    .text-highlight--headcount {
      --highlight-bg: #2DA8FF;
      --highlight-ink: #FFFFFF;
    }
    .text-highlight--independent {
      --highlight-bg: #FFD400;
      --highlight-ink: #07172F;
    }
    .text-highlight--rar {
      --highlight-bg: #6D28D9;
      --highlight-ink: #FFFFFF;
    }

    .switch-rail {
      margin-top: 18px;
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 6px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 420ms ease, transform 420ms ease;
      pointer-events: none;
    }
    .switch-rail.is-visible {
      display: flex;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .liquid-button {
      position: relative;
      overflow: hidden;
      appearance: none;
      border: 1px solid var(--chip-border, rgba(255,255,255,0.1));
      color: var(--text);
      border-radius: 999px;
      padding: 12px 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        var(--chip-bg, var(--panel-faint));
      font: 700 0.9rem "Manrope", sans-serif;
      cursor: pointer;
      transition: transform 220ms ease, border-color 220ms ease, background 220ms ease;
    }
    .liquid-button::before {
      content: "";
      position: absolute;
      inset: -20% -30%;
      background: linear-gradient(120deg, transparent 10%, rgba(255,255,255,0.25), transparent 52%);
      transform: translateX(-80%) rotate(8deg);
      transition: transform 520ms ease;
      pointer-events: none;
    }
    .liquid-button:hover::before,
    .liquid-button:focus-visible::before {
      transform: translateX(76%) rotate(8deg);
    }
    .liquid-button:hover,
    .liquid-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.22);
    }
    .liquid-button.is-active {
      background:
        linear-gradient(140deg, var(--chip-active-a, var(--button-active-a)), var(--chip-active-b, var(--button-active-b))),
        rgba(255,255,255,0.06);
      border-color: var(--line-strong);
      box-shadow: 0 18px 36px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .story {
      --text: #ffffff;
      --muted: rgba(255,255,255,0.78);
      --muted-soft: rgba(255,255,255,0.56);
      --line: rgba(255,255,255,0.14);
      --line-strong: rgba(255,255,255,0.26);
      --surface: rgba(21, 67, 137, 0.34);
      --surface-strong: rgba(21, 67, 137, 0.42);
      --surface-inset: rgba(201, 215, 236, 0.13);
      --panel: rgba(21, 67, 137, 0.34);
      --panel-faint: rgba(201, 215, 236, 0.13);
      --chip-bg: rgba(201, 215, 236, 0.14);
      --chip-border: rgba(255,255,255,0.18);
      --chip-active-a: #154389;
      --chip-active-b: #006FB8;
      margin-top: 0;
      display: none;
      gap: 22px;
      color: var(--text);
      opacity: 0;
      transform: translateY(22px);
      pointer-events: none;
    }
    .story.is-visible {
      display: grid;
      margin-top: 20px;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      animation: story-enter 480ms ease both;
    }

    .subject-nav {
      position: sticky;
      top: var(--chapter-rail-top);
      z-index: 8;
      display: flex;
      align-items: flex-end;
      gap: 0;
      min-height: 96px;
      padding: 8px 14px 0;
      overflow-x: auto;
      overflow-y: visible;
      scrollbar-width: none;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05)),
        rgba(21, 67, 137, 0.34);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 18px 42px rgba(0,0,0,0.18);
      backdrop-filter: blur(24px) saturate(1.16);
      -webkit-backdrop-filter: blur(24px) saturate(1.16);
    }
    .subject-nav::-webkit-scrollbar {
      display: none;
    }
    .subject-nav::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(255,255,255,0.16), transparent 34%, transparent 70%, rgba(53,187,217,0.16));
      pointer-events: none;
    }
    .subject-nav::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 1px;
      background: var(--chapter-rail-line);
      pointer-events: none;
    }

    .chapter-tab {
      position: relative;
      flex: 0 0 auto;
      min-width: var(--chapter-tab-min-width);
      margin-right: var(--chapter-tab-gap);
      padding: 0;
      border: 0;
      background: transparent;
      color: #000000;
      text-align: left;
      font: inherit;
      cursor: pointer;
      opacity: 0.88;
      transform: translateY(8px);
      transition: transform 220ms ease, opacity 220ms ease, filter 220ms ease;
    }
    .chapter-tab:last-child {
      margin-right: 0;
    }
    .chapter-tab:hover,
    .chapter-tab:focus-visible {
      transform: translateY(4px);
      outline: none;
      filter: brightness(1.02);
    }
    .chapter-tab.is-active {
      z-index: 5;
      opacity: 1;
      transform: translateY(0);
      filter: none;
    }
    .chapter-tab:not(.is-active) {
      filter: saturate(0.78) brightness(0.92);
    }
    .chapter-tab__shape {
      position: relative;
      display: grid;
      gap: 6px;
      min-height: var(--chapter-tab-height);
      padding: 12px 22px 10px 18px;
      overflow: hidden;
      clip-path: polygon(0 0, calc(100% - var(--chapter-tab-skew-right)) 0, 100% 100%, var(--chapter-tab-skew-left) 100%);
      border-radius: 14px 14px 0 0;
      border: 1px solid rgba(255,255,255,0.16);
      border-bottom: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 16px 34px rgba(0,0,0,0.12);
      transition: min-height 220ms ease, border-color 220ms ease, transform 220ms ease;
    }
    .chapter-tab__shape::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03) 42%, transparent 78%);
      pointer-events: none;
    }
    .chapter-tab__shape::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 10px;
      height: 1px;
      background: #FBBA00;
      opacity: 0;
      transform: scaleX(0.4);

    .tooltip {

      background: var(--panel-strong);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 22px 48px rgba(0,0,0,0.34);

      text-transform: uppercase;

    .path-region,
    .path-department {
      stroke: rgba(255,255,255,0.16);

      cursor: pointer;

      fill: var(--region-hover-fill, var(--accent)) !important;
      stroke: rgba(255,255,255,0.92);
      stroke-width: 2.35px;
      filter:
        drop-shadow(0 16px 24px rgba(11,29,58,0.16))
        drop-shadow(0 0 18px var(--region-hover-shadow, var(--accent-glow)));
    }
    .stage-shell.is-map-hover-locked #landingMap .path-region.is-hovered {
      fill: var(--map-idle) !important;
      stroke-width: 1.15px;
      filter: none;

    .path-region.is-selected,
    .path-department.is-selected {
      stroke: rgba(255,255,255,0.42);
      stroke-width: 2.1px;
      filter: drop-shadow(0 0 22px rgba(255,255,255,0.22));

    .inset-card {
      fill: var(--panel-faint);

    }
    .inset-label {

      font-size: 12px;
      font-weight: 700;

      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(8,19,28,0.88);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .focus-department-path {
      fill: none;

      stroke-linejoin: round;
      stroke-linecap: round;

    .focus-city-dot {
      fill: rgba(255,255,255,0.94);

      fill: rgba(248,252,255,0.96);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(8,19,28,0.88);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    @media (max-width: 1180px) {

        transform: translateY(0);

    @media (max-width: 1240px) {

        grid-template-columns: 1fr;
      }
      .employment-grid {
        grid-template-columns: 1fr;
      }
      .employment-map-grid {
        grid-template-columns: 1fr;
      }
      .employment-treemap-grid {
        grid-template-columns: 1fr;
      }
      .employment-intro {
        flex-direction: column;
      }
      .employment-controls {
        width: 100%;

        gap: 12px;
      }

      }

        padding: 10px;
        border-radius: 28px;
      }
      .topbar {
        padding: 12px 14px;
        border-radius: 22px;

      .brand img {

      }

      }
      .hero-panel,

        grid-template-columns: 1fr;
      }
      .employment-stat-grid {

      .employment-treemap-shell,

      .employment-treemap-label {

      .employment-treemap-value {

      .hero-panel h1 {
        max-width: none;
      }
      .section-card {
        padding: 18px;
      }
      .subject-nav {
        min-height: 90px;
        padding: 8px 8px 0;
        border-radius: 16px;
      }
      .chapter-tab {
        min-width: 214px;

      .chapter-tab__shape {

      }
      .section-head {
        padding: 18px;
        border-radius: 22px;
      }
      .section-title h2 {
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;

        filter: none;

    :root {

      --urssaf-warning: #F59E0B;
      --urssaf-alert: #E11D48;
      --neutral-50: #F8FAFC;
      --neutral-100: #F1F5F9;
      --neutral-200: #E2E8F0;
      --neutral-300: #CBD5E1;
      --neutral-400: #94A3B8;
      --neutral-500: #64748B;
      --neutral-700: #334155;
      --neutral-900: #0F172A;
      --bg: var(--urssaf-primary);
      --bg-soft: var(--urssaf-secondary);
      --page-bg: var(--neutral-50);
      --page-bg-soft: var(--neutral-100);
      --panel: #FFFFFF;
      --panel-strong: #FFFFFF;
      --panel-faint: var(--neutral-50);
      --surface: #FFFFFF;
      --surface-strong: var(--neutral-50);

      --nav-panel: var(--urssaf-primary);
      --editorial-panel: #FFFFFF;
      --editorial-panel-inner: var(--neutral-50);
      --chip-bg: var(--neutral-50);
      --chip-border: var(--neutral-300);
      --chip-active-a: var(--urssaf-primary);
      --chip-active-b: var(--urssaf-primary);
      --line: var(--neutral-200);
      --line-strong: var(--neutral-300);
      --text: var(--neutral-900);
      --muted: var(--neutral-700);
      --muted-soft: var(--neutral-500);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
      --radius-xl: 8px;
      --radius-lg: 8px;
      --radius-md: 8px;
      --accent: var(--urssaf-secondary);

    @media (max-width: 860px) {

    /* Product polish layer */
    :root {
      --product-ink: #07172F;

      --product-accent: #0EA5A8;
      --product-info: #2B82F6;
      --product-warning: #F59E0B;
      --product-alert: #E11D48;
      --product-paper: #F6F8FB;
      --product-paper-2: #FFFFFF;
      --product-paper-3: #EEF3F8;
      --product-line: #D9E2EC;
      --product-line-strong: #B9C7D6;
      --product-muted: #536273;
      --product-shadow: 0 18px 44px rgba(11, 29, 58, 0.10);
      --product-shadow-strong: 0 24px 70px rgba(11, 29, 58, 0.16);
      --product-focus: 0 0 0 3px rgba(14, 165, 168, 0.22), 0 0 0 1px #0EA5A8;

    .hero-action,

    .hero-action:hover,
    .hero-action:focus-visible,
    .deck-nav-button:not([disabled]):hover,

    .deck-dropdown-trigger:hover,

    .chapter-section[data-tone="1"] {
      --chapter-accent: #0B5CFF;
      --chapter-accent-contrast: #FFFFFF;
      --chapter-glow: rgba(11,92,255,0.22);
    }

    .chapter-section[data-tone="2"] {
      --chapter-accent: #E8233A;
      --chapter-accent-contrast: #FFFFFF;
      --chapter-glow: rgba(232,35,58,0.18);
    }

      --chapter-glow: rgba(255,214,0,0.22);

    .section-card,
    .story .section-card {
      padding: 22px;
      background: #FFFFFF;
      border-color: var(--product-line);
      box-shadow: 0 18px 46px rgba(11,29,58,0.08);
    }

      margin-top: 32px;
    }

    .payroll-rar-block .snap-card.is-snap-active {
      margin-top: 6px;
    }

    .snap-track {
      gap: 18px;
    }

    .snap-card.is-snap-active {
      border-color: var(--product-line-strong);
      box-shadow: 0 20px 48px rgba(11,29,58,0.13);
      filter: drop-shadow(0 18px 34px rgba(11,29,58,0.10));
    }

    .section-head,
    .story .section-head {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 16px 22px;
      min-height: var(--chapter-title-min-height);
      margin-bottom: 20px;
      padding: 0;
      overflow: visible;
      color: var(--product-ink);
      background: #FFFEFA;
      border: 2px solid var(--product-ink);
      border-radius: 0;
      box-shadow: var(--chapter-title-shadow);
    }

    .section-head::before,
    .story .section-head::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      display: block;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(7,23,47,0.04), transparent 28%, rgba(11,92,255,0.035));
    }

    .section-title {
      display: grid;
      grid-template-columns: var(--chapter-title-rail) minmax(0, 1fr);
      grid-template-rows: auto auto auto;
      align-content: center;
      align-items: center;
      width: 100%;
      min-width: 0;
      min-height: var(--chapter-title-min-height);
      max-width: none;
      gap: 0;
    }

    .section-kicker-row {
      grid-column: 1;
      grid-row: 1 / span 3;
      align-self: stretch;
      display: grid;
      place-items: center;
      min-height: var(--chapter-title-min-height);
      margin: 0;
      background: var(--chapter-accent);
      color: var(--chapter-accent-contrast);
      border-right: 2px solid var(--product-ink);
    }

    .section-kicker-rule {
      display: none;
    }

    .story .section-head .section-kicker,
    .section-kicker {
      color: inherit;
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .section-title h2 {
      grid-column: 2;
      align-self: end;
      margin: 0;
      padding: 22px 48px 4px;
      color: var(--product-ink);

    .map-card {

    .empty-state,

    .econ-header {
      --econ-bg: #2EBFC9;
      --econ-teal-deep: #00A3BB;
      --econ-coral: #F05A66;
      --econ-sky: #BACFE3;
      --econ-yellow: #FFD400;
      --econ-blue: #0074BC;
      --econ-orange: #F89B1B;
      --econ-date-blue: #164C8E;
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(236px, 300px);
      align-items: center;
      gap: clamp(16px, 2vw, 28px);
      min-height: 122px;
      padding: 22px 28px 18px 206px;
      overflow: visible;
      isolation: isolate;
      color: #FFFFFF;
      background: var(--econ-bg);
      border: 0;
      border-radius: 0;
      box-shadow: 0 18px 46px rgba(0, 116, 188, 0.18);
    }

    .econ-header-art-frame {
      position: absolute;
      inset: 0 auto 0 0;
      width: 185px;
      pointer-events: none;
    }

    .econ-header-art {
      display: block;
      width: 185px;
      height: 100%;
      pointer-events: none;
    }

    .econ-header-copy {
      min-width: 0;
      display: grid;
      gap: 13px;
      align-self: center;
    }

    .econ-header-copy h1 {
      margin: 0;
      color: #FFFFFF;
      font-size: clamp(2.35rem, 3.65vw, 3.55rem);
      line-height: 0.92;
      font-weight: 900;
      white-space: nowrap;
      text-wrap: balance;
    }

    .econ-header-copy p {
      margin: 0;
      color: var(--econ-date-blue);
      font-size: clamp(0.82rem, 1.1vw, 0.96rem);
      font-weight: 500;
    }

    .geo-control {
      position: relative;
      z-index: 12;
      justify-self: end;
      width: min(100%, 320px);
    }

    .geo-trigger {
      position: relative;
      width: 100%;
      min-height: 68px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "kicker chevron"
        "value chevron"
        "meta chevron";
      align-items: center;
      column-gap: 16px;
      padding: 12px 16px 12px 18px;
      appearance: none;
      text-align: left;
      color: #0B1D3A;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(239,249,252,0.90)),
        radial-gradient(circle at 94% 16%, rgba(46,191,201,0.22), transparent 30%);
      border: 1px solid rgba(255,255,255,0.88);
      border-radius: 18px;
      box-shadow:
        0 20px 44px rgba(0, 116, 188, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.86);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .geo-trigger:hover,
    .geo-trigger:focus-visible,
    .geo-control.is-open .geo-trigger {
      transform: translateY(-1px);
      border-color: #FFFFFF;
      box-shadow:
        0 24px 54px rgba(0, 116, 188, 0.24),
        0 0 0 3px rgba(255,255,255,0.36),
        inset 0 1px 0 rgba(255,255,255,0.96);
      outline: none;
    }

    .geo-trigger-kicker {
      grid-area: kicker;
      color: #0074BC;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .geo-trigger-value {
      grid-area: value;
      min-width: 0;
      color: #07172F;
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.1;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .geo-trigger-meta {
      grid-area: meta;
      color: #536273;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .geo-trigger-chevron {
      grid-area: chevron;
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: #0B1D3A;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
    }

    .geo-trigger-chevron::before {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      top: 10px;
      left: 12px;
      border-right: 2px solid #FFFFFF;
      border-bottom: 2px solid #FFFFFF;
      transform: rotate(45deg);
      transition: transform 180ms ease, top 180ms ease;
    }

    .geo-control.is-open .geo-trigger-chevron::before {
      top: 13px;
      transform: rotate(225deg);
    }

    .geo-menu {
      position: absolute;
      z-index: 40;
      top: calc(100% + 10px);
      right: 0;
      width: min(380px, calc(100vw - 48px));
      max-height: min(520px, calc(100vh - 180px));
      display: none;
      grid-template-columns: 1fr;
      gap: 6px;
      padding: 10px;
      overflow: auto;
      color: #07172F;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(185,199,214,0.78);
      border-radius: 18px;
      box-shadow: 0 28px 78px rgba(7, 23, 47, 0.26);
    }

    .geo-control.is-open .geo-menu {
      display: grid;
    }

    .geo-option {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 48px;
      padding: 10px 12px;
      appearance: none;
      text-align: left;
      color: #0B1D3A;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .geo-option:hover,
    .geo-option:focus-visible {
      background: #F1F7FA;
      border-color: #D9E2EC;
      outline: none;
      transform: translateX(1px);
    }

    .geo-option.is-selected {
      color: #FFFFFF;
      background:
        linear-gradient(135deg, #0B1D3A, #164C8E);
      border-color: #0B1D3A;
    }

    .geo-option-main {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .geo-option-title {
      font-size: 0.94rem;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .geo-option-subtitle {
      color: #64748B;
      font-size: 0.72rem;
      font-weight: 750;
    }

    .geo-option.is-selected .geo-option-subtitle {
      color: rgba(255,255,255,0.74);
    }

    .geo-option-mark {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #2EBFC9;
      box-shadow: 0 0 0 4px rgba(46,191,201,0.18);
      opacity: 0;
    }

    .geo-option.is-selected .geo-option-mark {
      opacity: 1;
    }

    .switch-rail {
      display: none !important;
    }

      function collectHighlightMatches(text) {
        const matches = [];
        highlightTerms.forEach((term) => {
          term.pattern.lastIndex = 0;
          let match;
          while ((match = term.pattern.exec(text)) !== null) {
            matches.push({
              start: match.index,
              end: match.index + match[0].length,
              key: term.key,
            });
          }
        });
        return matches
          .sort((left, right) => left.start - right.start || (right.end - right.start) - (left.end - left.start))
          .reduce((accepted, match) => {
            const overlaps = accepted.some((item) => match.start < item.end && item.start < match.end);
            if (!overlaps) accepted.push(match);
            return accepted;
          }, []);
      }

      function highlightTextTerms(root) {
        if (!root) return;
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            if (node.parentElement && node.parentElement.closest(".text-highlight, script, style")) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          },
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        nodes.forEach((node) => {
          const text = node.nodeValue;
          const matches = collectHighlightMatches(text);
          if (!matches.length) return;

          const fragment = document.createDocumentFragment();
          let cursor = 0;
          matches.forEach((match) => {
            if (match.start > cursor) {
              fragment.appendChild(document.createTextNode(text.slice(cursor, match.start)));
            }
            const span = document.createElement("span");
            span.className = `text-highlight text-highlight--${match.key}`;
            span.textContent = text.slice(match.start, match.end);
            fragment.appendChild(span);
            cursor = match.end;
          });
          if (cursor < text.length) {
            fragment.appendChild(document.createTextNode(text.slice(cursor)));
          }
          node.parentNode.replaceChild(fragment, node);
        });
      }

        chapterRegistry.forEach((chapter) => {

          if (rect.top <= activationLine) {

          if (rect.bottom <= activationLine || rect.top >= window.innerHeight * 0.74) {
            return;
          }
          const distance = Math.abs(rect.top - activationLine);
          if (distance < bestDistance) {
            bestDistance = distance;
            candidate = chapter;
          }
        });
        return candidate || fallback;

        const activationLine = chapterActivationLine();

        cards.forEach((card) => {

          const visibleTop = Math.max(rect.top, activationLine);
          const visibleBottom = Math.min(rect.bottom, viewportBottom);
          const visibleHeight = Math.max(0, visibleBottom - visibleTop);
          if (!visibleHeight) return;
          const availableHeight = Math.max(1, viewportBottom - activationLine);
          const visibleRatio = visibleHeight / Math.min(Math.max(rect.height, 1), availableHeight);
          const distancePenalty = Math.min(Math.abs(rect.top - activationLine) / Math.max(viewportBottom, 1), 1) * 0.12;
          const score = visibleRatio - distancePenalty;

      function buildScale(domain, colors) {
        return d3.scaleLinear().domain(domain).range(colors).clamp(true);
      }

      function ringArea(ring) {
        const points = ring && ring.length > 1 && ring[0][0] === ring[ring.length - 1][0] && ring[0][1] === ring[ring.length - 1][1]
          ? ring.slice(0, -1)
          : ring;
        if (!points || points.length < 3) return 0;
        let area = 0;
        for (let index = 0; index < points.length; index += 1) {
          const [x1, y1] = points[index];
          const [x2, y2] = points[(index + 1) % points.length];
          area += (x1 * y2) - (x2 * y1);
        }
        return Math.abs(area / 2);
      }

      function polygonArea(polygon) {
        if (!polygon || !polygon.length) return 0;
        return ringArea(polygon[0]);
      }

      function pruneDisplayGeometry(geometry) {
        if (!geometry || geometry.type !== "MultiPolygon") return geometry;
        const rankedPolygons = geometry.coordinates
          .map((polygon) => ({ polygon, area: polygonArea(polygon) }))
          .filter((entry) => entry.area > 0)
          .sort((left, right) => right.area - left.area);
        if (rankedPolygons.length <= 1) return geometry;
        const minimumArea = rankedPolygons[0].area * DISPLAY_POLYGON_AREA_RATIO;
        const keptPolygons = rankedPolygons
          .filter((entry) => entry.area >= minimumArea)
          .map((entry) => entry.polygon);
        if (!keptPolygons.length) {
          return { type: "Polygon", coordinates: rankedPolygons[0].polygon };
        }
        return keptPolygons.length === 1
          ? { type: "Polygon", coordinates: keptPolygons[0] }
          : { type: "MultiPolygon", coordinates: keptPolygons };
      }

      const displayRegionFeatures = DATA.geography.regions.features.map((feature) => ({
        ...feature,
        geometry: pruneDisplayGeometry(feature.geometry),
      }));
      const displayRegionsGeojson = { ...DATA.geography.regions, features: displayRegionFeatures };
      const displayRegionFeatureByCode = new Map(displayRegionFeatures.map((feature) => [feature.properties.code, feature]));

      function showTooltip(event, label, value) {
        tooltipLabel.textContent = label;

      function hideTooltip() {

      function drawCompositeMap(selection, featureCollection, config) {
        selection.selectAll("*").remove();
        const root = selection.append("g").attr("class", "map-root");
        const cameraGroup = root.append("g").attr("class", "camera-group");
        const featureLayer = cameraGroup.append("g").attr("class", "feature-layer");
        const focusGroup = cameraGroup.append("g").attr("class", "focus-layer");
        const features = featureCollection.features;
        const mainlandFeatures = features.filter((feature) => !domCodes.has(config.regionResolver(feature)));
        const projection = d3.geoMercator().fitExtent(
          [[mapLayout.mainlandExtent[0], mapLayout.mainlandExtent[1]], [mapLayout.mainlandExtent[2], mapLayout.mainlandExtent[3]]],
          { type: "FeatureCollection", features: mainlandFeatures },
        );
        const path = d3.geoPath(projection);
        const pathByCode = new Map();
        const labelByCode = new Map();
        const pathGeneratorByCode = new Map();
        const clearPathHover = () => {
          if (!config.hoverClass) return;
          pathByCode.forEach((pathElement) => pathElement.classed(config.hoverClass, false));
        };
        const canUseHoverEffect = () => !config.canHover || config.canHover();
        const canShowPathTooltip = () => !config.canShowTooltip || config.canShowTooltip();
        const setPathHover = (element, enabled) => {
          if (!config.hoverClass) return;
          if (enabled && !canUseHoverEffect()) {
            clearPathHover();
            return;
          }
          if (enabled) {
            clearPathHover();
          }
          element.classed(config.hoverClass, enabled);
        };

        const mainlandGroup = featureLayer.append("g").attr("class", "mainland-layer");
        const labelLayer = config.showMainlandLabels ? featureLayer.append("g").attr("class", "mainland-label-layer") : null;
        mainlandFeatures.forEach((feature) => {
          const key = config.keyResolver(feature);
          const element = mainlandGroup.append("path")
            .datum(feature)
            .attr("class", config.className(feature))
            .attr("d", path)
              .attr("fill", config.fillResolver(feature))
              .attr("data-code", key)
              .on("mouseenter", (event, datum) => {
                if (!canUseHoverEffect()) {
                  clearPathHover();
                } else {
                  setPathHover(element, true);
                  element.raise();
                }
                if (!canShowPathTooltip()) {
                  hideTooltip();
                  return;
                }
                const tooltipText = config.tooltipResolver(datum);
                showTooltip(event, tooltipText.label, tooltipText.value);
              })
              .on("mousemove", (event, datum) => {
                if (!canUseHoverEffect()) {
                  clearPathHover();
                }
                if (!canShowPathTooltip()) {
                  hideTooltip();
                  return;
                }
                const tooltipText = config.tooltipResolver(datum);
                showTooltip(event, tooltipText.label, tooltipText.value);
              })
              .on("mouseleave", () => {
                setPathHover(element, false);
                hideTooltip();
              });
          if (config.clickable) {
            element.on("click", () => {
              clearPathHover();
              hideTooltip();
              config.onClick(key);
            });
          }
          pathByCode.set(key, element);
          pathGeneratorByCode.set(key, path);
        });
        if (labelLayer) {
          mainlandFeatures.forEach((feature) => {
            const code = config.regionResolver(feature);
            const region = regionsByCode.get(code);
            if (!region) return;
            const layout = MAINLAND_REGION_LABELS.get(code) || { lines: [region.name] };
            const [baseX, baseY] = path.centroid(feature);
            if (!Number.isFinite(baseX) || !Number.isFinite(baseY)) return;
            const x = baseX + (layout.dx || 0);
            const lineHeight = layout.lineHeight || 14;
            const startY = baseY + (layout.dy || 0) - ((layout.lines.length - 1) * lineHeight) / 2;
            const text = labelLayer.append("text")
              .attr("class", "map-region-label")
              .attr("x", x)
              .attr("y", startY)
              .attr("data-code", code);
            if (layout.fontSize) {
              text.style("font-size", `${layout.fontSize}px`);
            }
            layout.lines.forEach((line, index) => {
              text.append("tspan")
                .attr("x", x)
                .attr("y", startY + index * lineHeight)
                .text(line);
            });
            labelByCode.set(code, text);
          });
        }

        Object.entries(mapLayout.domInsets).forEach(([regionCode, inset]) => {
          const insetFeatures = features.filter((feature) => config.regionResolver(feature) === regionCode);
          const group = featureLayer.append("g").attr("class", `inset inset-${regionCode}`);
          group.append("rect").attr("class", "inset-card").attr("x", inset.x).attr("y", inset.y).attr("width", inset.width).attr("height", inset.height).attr("rx", 24);
          const pathGroup = group.append("g").attr("class", "inset-path-layer");
          group.append("text").attr("class", "inset-label").attr("x", inset.x + 16).attr("y", inset.y + 22).text(regionsByCode.get(regionCode).name);
          const insetProjection = d3.geoMercator().fitExtent(
            [[inset.x + 18, inset.y + 34], [inset.x + inset.width - 18, inset.y + inset.height - 18]],
            { type: "FeatureCollection", features: insetFeatures },
          );
          const insetPath = d3.geoPath(insetProjection);
          insetFeatures.forEach((feature) => {
            const key = config.keyResolver(feature);
            const element = pathGroup.append("path")
              .datum(feature)
              .attr("class", config.className(feature))
              .attr("d", insetPath)
              .attr("fill", config.fillResolver(feature))
              .attr("data-code", key)
              .on("mouseenter", (event, datum) => {
                if (!canUseHoverEffect()) {
                  clearPathHover();
                } else {
                  setPathHover(element, true);
                  element.raise();
                }
                if (!canShowPathTooltip()) {
                  hideTooltip();
                  return;
                }
                const tooltipText = config.tooltipResolver(datum);
                showTooltip(event, tooltipText.label, tooltipText.value);
              })
              .on("mousemove", (event, datum) => {
                if (!canUseHoverEffect()) {
                  clearPathHover();
                }
                if (!canShowPathTooltip()) {
                  hideTooltip();
                  return;
                }
                const tooltipText = config.tooltipResolver(datum);
                showTooltip(event, tooltipText.label, tooltipText.value);
              })
              .on("mouseleave", () => {
                setPathHover(element, false);
                hideTooltip();
              });
            if (config.clickable) {
              element.on("click", () => {
                clearPathHover();
                hideTooltip();
                config.onClick(key);
              });
            }
            pathByCode.set(key, element);
            pathGeneratorByCode.set(key, insetPath);
          });
        });

        return {
          rootGroup: root,
          cameraGroup,
          cameraState: { scale: 1, x: 0, y: 0 },
          featureLayer,
          focusGroup,
          pathByCode,
          labelByCode,
          pathGeneratorByCode,
        };
      }

      function renderLandingMap() {
        const regionValues = mapRegionValues();
        const numericValues = [...regionValues.values()].filter((value) => value != null);
        const colorScale = numericValues.length
          ? buildScale(d3.extent(numericValues), [paletteToken("map-national-low", "rgba(255,255,255,0.08)"), paletteToken("map-national-high", "rgba(120,236,203,0.9)")])

          clickable: true,

          canShowTooltip: () => !state.mapHoverLocked,
          keyResolver: (feature) => feature.properties.code,
          regionResolver: (feature) => feature.properties.code,

          fillResolver: (feature) => {

      function highlightSelectedRegion() {

      function clearFocusOverlay() {
        if (chartRefs.regionMap.focusGroup) {
          chartRefs.regionMap.focusGroup.selectAll("*").remove();
        }
      }

      function applyCameraTransform() {
        const { cameraGroup, cameraState } = chartRefs.regionMap;
        if (!cameraGroup || !cameraState) return;
        cameraGroup.attr("transform", `translate(${cameraState.x},${cameraState.y}) scale(${cameraState.scale})`);
      }

      function getRegionCameraTarget(regionCode, options = {}) {
        const selection = chartRefs.regionMap.pathByCode.get(regionCode);
        if (!selection) return null;
        const node = selection.node();
        const bbox = node.getBBox();
        const scaleMultiplier = options.scaleMultiplier ?? 1;
        const minScale = options.minScale ?? 1.8;
        const maxScale = options.maxScale ?? 4.2;
        const targetScale = Math.max(minScale, Math.min(maxScale, (620 / Math.max(bbox.width, bbox.height)) * scaleMultiplier));
        return {
          scale: targetScale,
          x: mapLayout.width / 2 - (bbox.x + bbox.width / 2) * targetScale,
          y: mapLayout.height / 2 - (bbox.y + bbox.height / 2) * targetScale,
        };
      }

      function animateCameraToTarget(target, options = {}) {
        if (!target) return Promise.resolve();
        const transform = chartRefs.regionMap.cameraState;
        if (REDUCED_MOTION) {
          transform.scale = target.scale;
          transform.x = target.x;
          transform.y = target.y;
          applyCameraTransform();
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          gsap.to(transform, {
            scale: target.scale,
            x: target.x,
            y: target.y,
            duration: options.duration ?? 1.2,
            ease: options.ease ?? "power2.inOut",
            onUpdate: applyCameraTransform,
            onComplete: resolve,
          });
        });
      }

      function drawDepartmentFocusPaths(regionCode) {
        const focusGroup = chartRefs.regionMap.focusGroup;
        const generator = chartRefs.regionMap.pathGeneratorByCode.get(regionCode);
        if (!focusGroup || !generator || !DATA.geography.departments) return [];
        clearFocusOverlay();
        return DATA.geography.departments.features
          .filter((feature) => feature.properties.region === regionCode)
          .map((feature) => focusGroup.append("path")
            .datum(feature)
            .attr("class", "focus-department-path")
            .attr("d", generator(feature))
            .attr("stroke-dasharray", 1)
            .attr("stroke-dashoffset", 1)
            .attr("pathLength", 1)
            .attr("opacity", 0));
      }

      function drawRegionCityMarker(regionCode) {
        const focusGroup = chartRefs.regionMap.focusGroup;
        const generator = chartRefs.regionMap.pathGeneratorByCode.get(regionCode);
        const city = REGION_PRIMARY_CITIES.get(regionCode);
        if (!focusGroup || !generator || !city || typeof generator.projection !== "function") return null;
        const projection = generator.projection();
        if (!projection) return null;
        const projected = projection(city.coordinates);
        if (!projected || !Number.isFinite(projected[0]) || !Number.isFinite(projected[1])) return null;
        const [x, y] = projected;
        const group = focusGroup.append("g").attr("class", "focus-city").attr("opacity", 0);
        group.append("circle").attr("class", "focus-city-dot").attr("cx", x).attr("cy", y).attr("r", 3.6);
        group.append("text").attr("class", "focus-city-label").attr("x", x).attr("y", y - 14).text(city.name);
        return group;
      }

      function animateDepartmentFocus(regionCode) {
        const paths = drawDepartmentFocusPaths(regionCode);
        const cityMarker = drawRegionCityMarker(regionCode);
        if (!paths.length) return Promise.resolve();
        if (REDUCED_MOTION) {
          paths.forEach((path) => path.attr("stroke-dashoffset", 0).attr("opacity", 1));
          if (cityMarker) cityMarker.attr("opacity", 1);
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          const timeline = gsap.timeline({ onComplete: resolve });
          const totalStagger = 0.7;
          const eachDelay = paths.length > 1 ? totalStagger / (paths.length - 1) : 0;
          paths.forEach((path, index) => {
            timeline.to(path.node(), {
              attr: { "stroke-dashoffset": 0 },
              opacity: 1,
              duration: 0.62,
              ease: "power2.out",
            }, index * eachDelay);
          });
          if (cityMarker) {
            timeline.to(cityMarker.node(), {
              opacity: 1,
              duration: 0.38,
              ease: "power2.out",
            }, Math.min(totalStagger * 0.45, 0.42));
          }
        });
      }

      async function parseDeferredData() {
        const binary = atob(DEFERRED_GZIP);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return JSON.parse(await new Response(stream).text());
      }

      function ensureDeferredData() {
        if (DATA.modules && DATA.geography.departments) {
          return Promise.resolve(DATA);
        }
        deferredDataPromise ??= parseDeferredData().then((deferred) => {
          DATA.geography = { ...DATA.geography, ...deferred.geography };
          DATA.modules = deferred.modules;
          state.sectorEffectifsSeriesKey ??= DATA.modules.sector.regional.national.defaultSeriesKey;
          state.sectorPayrollSeriesKey ??= DATA.modules.sector.regional.national.defaultSeriesKey;
          state.sectorDepartmentSectorKey ??= DATA.modules.sector.departmental.defaultSectorKey;
          state.autoSector ??= DATA.modules.auto.defaultSector;
          return DATA;
        });
        return deferredDataPromise;
      }

      function scheduleStoryRender() {
        if (storyRenderHandle != null) cancelAnimationFrame(storyRenderHandle);
        storyRenderHandle = requestAnimationFrame(() => {
          storyRenderHandle = null;
          ensureDeferredData()
            .then(() => {
              renderStoryModules();
              hydrateChapterSections();
              refreshChapterTracking();
              mountScrollReveal();
              scheduleScrollTriggerRefresh();
              scheduleChapterNavVisibility();
            })
            .catch((error) => console.error("Deferred payload error", error));
        });
      }

      function revealContent() {
        story.classList.add("is-visible");
        renderSwitchRail();
        refreshChapterTracking();
        scheduleScrollTriggerRefresh();
        scheduleChapterNavVisibility();
      }

      function applyPhase(phase) {
        state.phase = phase;
        stageShell.dataset.phase = phase;
        if (phase === "landing") {
          state.mapHoverLocked = false;
        }
        stageShell.classList.toggle("is-map-hover-locked", state.mapHoverLocked);
        clearChapterScrollLock();
        renderHeaderActions();
        if (phase === "landing") {
          document.body.classList.remove("chapter-nav-ready");
          story.classList.remove("is-visible");
          if (chapterObserver) {
            chapterObserver.disconnect();
          }
          clearSnapCardTracking();
          setMapStageMode("landing");
        } else if (phase === "national") {
          setMapStageMode("national");
          scheduleChapterNavVisibility();
        } else {
          scheduleChapterNavVisibility();
        }
      }

      function animateFranceRipple() {
        const values = DATA.regions.map((region) => region.hero.payroll && region.hero.payroll.value).filter((value) => value != null);
        const scale = buildScale(
          d3.extent(values),
          [paletteToken("map-national-low", "rgba(255,255,255,0.08)"), paletteToken("map-national-high", "rgba(120,236,203,0.92)")],
        );
        const center = { x: mapLayout.width / 2, y: mapLayout.height / 2 };
        const ring = chartRefs.regionMap.focusGroup.append("circle").attr("class", "ripple-ring").attr("cx", center.x).attr("cy", center.y).attr("r", 30).attr("opacity", 0.7);
        const timeline = gsap.timeline();
        timeline.to(ring.node(), { attr: { r: 760 }, opacity: 0, duration: REDUCED_MOTION ? 0.01 : 1.8, ease: "power2.out" });
        chartRefs.regionMap.pathByCode.forEach((selection, code) => {
          const region = regionsByCode.get(code);
          const value = region.hero.payroll && region.hero.payroll.value;
          const box = selection.node().getBBox();
          const dx = center.x - (box.x + box.width / 2);
          const dy = center.y - (box.y + box.height / 2);
          const delay = Math.sqrt(dx * dx + dy * dy) / 560;
          timeline.to(selection.node(), { fill: value != null ? scale(value) : paletteToken("map-empty", "rgba(255,255,255,0.06)"), duration: REDUCED_MOTION ? 0.01 : 0.9, ease: "power2.out" }, delay);
        });
        timeline.add(() => clearFocusOverlay());
        return timeline;
      }

      function transitionToLanding() {
        regionTransitionToken += 1;
        clearFocusOverlay();
        gsap.killTweensOf(chartRefs.regionMap.cameraState);
        gsap.killTweensOf(mapStage);
        stageVideo.pause();
        resetCamera();
        setTheme(null);
        applyPhase("landing");
        renderLandingMap();
        window.scrollTo({
          top: 0,
          behavior: REDUCED_MOTION ? "auto" : "smooth",
        });
      }

      function transitionToNational(fromRail) {
        regionTransitionToken += 1;
        clearFocusOverlay();
        gsap.killTweensOf(chartRefs.regionMap.cameraState);
        gsap.killTweensOf(mapStage);
        resetCamera();
        applyPhase("national");
        setTheme(state.selectedRegion);
        updateVideo("national");
        mapStage.classList.remove("is-hidden", "is-muted");
        gsap.set(mapStage, { opacity: 1 });
        renderLandingMap();
        renderHero();
        if (REDUCED_MOTION || fromRail) {
          try {
            animateFranceRipple();
          } catch (error) {
            console.error("National ripple animation error", error);
          }
          revealContent();
          scheduleStoryRender();
          setMapStageMode("national");
          return;
        }
        let revealDone = false;
        const finishReveal = () => {
          if (revealDone) return;
          revealDone = true;
          revealContent();
          scheduleStoryRender();
          setMapStageMode("national");
        };
        const revealFallback = window.setTimeout(finishReveal, 1800);
        const timeline = gsap.timeline();
        timeline.add(() => {
          try {
            animateFranceRipple();
          } catch (error) {
            console.error("National ripple animation error", error);
            window.clearTimeout(revealFallback);
            finishReveal();
          }
        }, 0.05);
        timeline.call(() => {
          window.clearTimeout(revealFallback);
          finishReveal();
        }, null, 1.45);
      }

      async function transitionToRegion(regionCode, fromRail) {
        const transitionToken = ++regionTransitionToken;
        state.mapHoverLocked = true;
        stageShell.classList.add("is-map-hover-locked");
        chartRefs.regionMap.pathByCode.forEach((element) => element.classed("is-hovered", false));
        hideTooltip();
        state.selectedRegion = regionCode;
        setTheme(regionCode);
        hideMapLabels();
        renderHero();
        renderSwitchRail();
        updateVideo(regionCode);
        clearFocusOverlay();
        gsap.killTweensOf(chartRefs.regionMap.cameraState);
        gsap.killTweensOf(mapStage);

        if (REDUCED_MOTION || fromRail || state.phase !== "landing") {
          applyPhase("region");
          setMapStageMode("region");
          revealContent();
          scheduleStoryRender();
          return;
        }

        mapStage.classList.remove("is-hidden", "is-muted");
        gsap.set(mapStage, { opacity: 1 });
        resetCamera();

        await animateCameraToTarget(
          getRegionCameraTarget(regionCode),
          { duration: 1.2, ease: "power2.inOut" },
        );
        if (transitionToken !== regionTransitionToken) return;

        await ensureDeferredData().catch((error) => {
          console.error("Deferred payload error", error);
        });
        if (transitionToken !== regionTransitionToken) return;

        await animateDepartmentFocus(regionCode);
        if (transitionToken !== regionTransitionToken) return;

        await animateCameraToTarget(
          getRegionCameraTarget(regionCode, { scaleMultiplier: 1.28, maxScale: 5.1 }),
          { duration: 1.22, ease: "power2.out" },
        );
        if (transitionToken !== regionTransitionToken) return;

        clearFocusOverlay();
        applyPhase("region");
        renderHero();
        await new Promise((resolve) => {
          gsap.to(mapStage, {
            opacity: 0,
            duration: 0.32,
            ease: "power2.inOut",
            onComplete: resolve,
          });
        });
        if (transitionToken !== regionTransitionToken) return;

        setMapStageMode("region");
        revealContent();
        scheduleStoryRender();
        clearFocusOverlay();
      }

      function renderMetricSwitch(containerId, items, activeKey, onChange) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        items.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `metric-button${item.key === activeKey ? " is-active" : ""}`;
          button.textContent = item.label;
          button.addEventListener("click", () => onChange(item.key));
          container.appendChild(button);
        });
      }

      function renderEmptyState(target, title, message) {
        target.innerHTML = `<div class="empty-state"><strong>${title}</strong><p>${message}</p></div>`;
      }

      function syncDepartmentRankingHeight(gridElement) {
        if (!gridElement) return;
        requestAnimationFrame(() => {
          const isStacked = window.matchMedia("(max-width: 980px)").matches;
          const mapPanel = gridElement.querySelector(".map-card");
          const rankingPanel = gridElement.querySelector(".department-ranking-panel");
          if (!mapPanel || !rankingPanel || isStacked) {
            gridElement.style.removeProperty("--department-map-height");
            return;
          }
          const mapHeight = mapPanel.offsetHeight;
          if (mapHeight > 0) {
            gridElement.style.setProperty("--department-map-height", `${mapHeight}px`);
          }
        });
      }
__CHAPTER_MODULES_SCRIPT__
      function renderStoryModules() {
        chapterRegistry.forEach((chapter) => chapter.render());
      }

      function setupFooter() {
        const generatedAt = new Date(DATA.meta.generatedAt);
        document.getElementById("footerTimestamp").textContent = `Généré ${generatedAt.toLocaleDateString("fr-FR", { dateStyle: "medium" })} / ${generatedAt.toLocaleTimeString("fr-FR", { timeStyle: "short" })}`;
      }

      function initGeographySelector() {
        publicationMeta.textContent = publicationLabel;
        geoTrigger.addEventListener("click", () => {
          setGeoMenuOpen(!geoControl.classList.contains("is-open"));
        });
        document.addEventListener("click", (event) => {
          if (!geoControl.contains(event.target)) {
            setGeoMenuOpen(false);
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            setGeoMenuOpen(false);
            geoTrigger.focus();
          }
        });
      }

      function initChapterNavigation() {
        hydrateChapterSections();
        renderSubjectNav();
        window.addEventListener("scroll", () => {
          scheduleSnapCardSync();
          scheduleChapterNavVisibility();
        }, { passive: true });
        window.addEventListener("resize", () => {
          refreshChapterTracking();
          scheduleChapterNavVisibility();
        }, { passive: true });
      }

      function mountScrollReveal() {
        const revealItems = gsap.utils.toArray(".section-card, .snap-card")
          .filter((element) => !element.dataset.revealMounted);
        revealItems.forEach((element) => {
          element.dataset.revealMounted = "true";
          gsap.from(element, {
            opacity: 0,
            y: 24,
            duration: REDUCED_MOTION ? 0.01 : 0.75,
            ease: "power2.out",
            clearProps: "opacity,transform",
            scrollTrigger: {
              trigger: element,
              start: "top 82%",
              once: true,
            },
          });
        });
      }

      function boot() {
        applyColorTokens();
        setTheme(null);
        initChapterNavigation();
        setupFooter();
        initGeographySelector();
        renderLandingMap();
        renderHero();
        renderSwitchRail();
        renderHeaderActions();
        stageVideo.muted = true;
        setMapStageMode("landing");
        ensureDeferredData().catch((error) => console.error("Deferred payload error", error));
        if (document.readyState === "complete") {
          scheduleScrollTriggerRefresh();
        } else {
          window.addEventListener("load", scheduleScrollTriggerRefresh, { once: true });
        }
      }

      boot();
    })();
  </script>
</body>
